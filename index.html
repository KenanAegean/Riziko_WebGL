<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Riziko</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* --- MOBILE FIXED DARK THEME CSS --- */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%; /* Fixes the mobile 100vh address bar bug */
        overflow: hidden;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overscroll-behavior: none; /* Prevent bounce scrolling on iOS */
      }
      
      #unity-container, #unity-fullscreen-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        /* Flexbox guarantees absolute centering */
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        background-color: transparent !important;
      }

      /* Glassmorphism Loading Box */
      #unity-loading-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 40px 50px;
        border-radius: 16px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 10;
      }

      #unity-logo {
        width: 100px;
        height: 100px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        background-size: contain;
        margin-bottom: 25px;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.3));
      }

      #unity-progress-bar-empty {
        width: 300px;
        height: 14px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        border-radius: 20px;
        transition: width 0.3s ease-out;
      }

      .loading-text {
        color: #00d2ff;
        margin-top: 20px;
        font-size: 13px;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: bold;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% { opacity: 0.5; text-shadow: none; }
        50% { opacity: 1; text-shadow: 0 0 10px #00d2ff; }
        100% { opacity: 0.5; text-shadow: none; }
      }
      
      #unity-footer { display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <!-- Removed fixed width/height attributes from canvas -->
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
          <div class="loading-text">Loading Riziko...</div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Riziko</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px; color: black;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/riziko_0340.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/riziko_0340.data.unityweb",
        frameworkUrl: buildUrl + "/riziko_0340.framework.js.unityweb",
        codeUrl: buildUrl + "/riziko_0340.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: "Kenan Ege",
        productName: "Riziko",
        productVersion: "0.340",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        fullscreenContainer.style.width = "100%";
        fullscreenContainer.style.height = "100%";
      }

      // Disabled static background to show the dark gradient theme
      // canvas.style.background = "url('" + buildUrl + "/riziko_0340.jpg') center / cover";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "flex";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.transition = "opacity 0.5s ease";
            loadingContainer.style.opacity = "0";
            setTimeout(() => { loadingContainer.style.display = "none"; }, 500);
          }
        }).then((unityInstance) => {
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
