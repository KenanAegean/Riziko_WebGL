<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Riziko Phone Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: one full-screen game canvas; a loading card on top until the game starts. Single dark look (the game's own). */
  :root {
    --night: #0b0b1a;
    --panel: #15152b;
    --line: #3a3a63;
    --text: #e9e7f5;
    --muted: #9c98c2;
    --purple: #a44ccc;
    --danger: #e06666;
    --mono: "Silkscreen", "Courier New", monospace;
    --body: "Space Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--body);
    overflow: hidden;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: var(--night);
  }
  #unity-canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--night);
    touch-action: none;
    outline: none;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--night);
  }
  .card {
    width: min(360px, 100%);
    display: grid;
    gap: 14px;
    padding: 22px 20px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .card h1 {
    margin: 0;
    font-family: var(--mono);
    font-size: 30px;
    letter-spacing: 0.08em;
    text-wrap: balance;
  }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .bar { height: 10px; background: var(--night); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: var(--purple); transition: width 0.2s linear; }
  #status { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  #error { color: var(--danger); font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  @media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Mono&display=swap">

<div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

<div id="loading">
  <div class="card">
    <h1>RIZIKO</h1>
    <p>Phone test build. Portrait uses the phone layout; turn the phone sideways for the PC layout.</p>
    <div class="bar"><div id="progress"></div></div>
    <div id="status">Loading 19 MB…</div>
    <div id="error" hidden></div>
  </div>
</div>

<script>
  (function () {
    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var progress = document.getElementById("progress");
    var status = document.getElementById("status");
    var error = document.getElementById("error");

    function showError(message) {
      error.hidden = false;
      error.textContent = String(message);
      status.textContent = "The game could not start.";
      loading.hidden = false;
    }

    var config = {
      // Brotli files from Unity (decompression fallback), published under a .wasm name.
      dataUrl: "Build/WebGL.data.wasm",
      frameworkUrl: "Build/WebGL.framework.wasm",
      codeUrl: "Build/WebGL.code.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Kenan Ege",
      productName: "Riziko",
      productVersion: "0.324",
      // Sharp enough, and light enough for smooth animations on phones.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      autoSyncPersistentDataPath: true,
      showBanner: function (msg, type) { if (type === "error") showError(msg); }
    };

    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onerror = function () { showError("The game loader did not load."); };
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        progress.style.width = Math.round(p * 100) + "%";
        status.textContent = p < 0.9 ? "Loading… " + Math.round(p * 100) + "%" : "Starting…";
      }).then(function () {
        loading.hidden = true;
        canvas.focus();
      }).catch(showError);
    };
    document.body.appendChild(script);
  })();
</script>

</body></html>
